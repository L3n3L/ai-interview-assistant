<!doctype html>
<html lang="zh-CN" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#f7f8fa" />
        <title>回答</title>
        <style>
            :root {
                color-scheme: light;
                --page: #f7f8fa;
                --surface: #ffffff;
                --text: #20242b;
                --muted: #68717e;
                --border: #e4e7ec;
                --accent: #526f9b;
                --shadow: 0 8px 28px rgb(21 32 48 / 4%);
            }

            html[data-theme='dark'] {
                color-scheme: dark;
                --page: #111418;
                --surface: #191e24;
                --text: #edf0f4;
                --muted: #a5afbc;
                --border: #2a313a;
                --accent: #a8bfdc;
                --shadow: 0 8px 28px rgb(0 0 0 / 14%);
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                min-width: 280px;
                min-height: 100%;
                margin: 0;
                background: var(--page);
                color: var(--text);
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
                font-size: 16px;
                line-height: 1.7;
                -webkit-font-smoothing: antialiased;
                transition: background-color 180ms ease, color 180ms ease;
            }

            .page {
                width: min(100%, 760px);
                min-height: 100vh;
                min-height: 100dvh;
                margin: 0 auto;
                padding: max(12px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
            }

            .theme-toggle {
                position: fixed;
                z-index: 2;
                top: max(10px, env(safe-area-inset-top));
                right: max(10px, env(safe-area-inset-right));
                display: grid;
                width: 44px;
                height: 44px;
                place-items: center;
                border: 1px solid var(--border);
                border-radius: 14px;
                background: var(--surface);
                color: var(--text);
                box-shadow: var(--shadow);
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
                transition: background-color 180ms ease, border-color 180ms ease, transform 120ms ease;
            }

            .theme-toggle:active {
                transform: scale(0.96);
            }

            .theme-toggle:focus-visible {
                outline: 3px solid var(--accent);
                outline-offset: 3px;
            }

            .theme-toggle svg {
                width: 21px;
                height: 21px;
            }

            .theme-toggle .moon,
            html[data-theme='dark'] .theme-toggle .sun {
                display: none;
            }

            html[data-theme='dark'] .theme-toggle .moon {
                display: block;
            }

            .answers {
                display: grid;
                gap: 12px;
                padding-top: 58px;
            }

            .answer {
                min-width: 0;
                padding: 18px 18px 20px;
                overflow-wrap: anywhere;
                border: 1px solid var(--border);
                border-radius: 16px;
                background: var(--surface);
                box-shadow: var(--shadow);
            }

            .answer-content > :first-child {
                margin-top: 0;
            }

            .answer-content > :last-child {
                margin-bottom: 0;
            }

            .answer-content p {
                margin: 0 0 0.85em;
            }

            .answer-content h1,
            .answer-content h2,
            .answer-content h3,
            .answer-content h4 {
                margin: 1em 0 0.45em;
                line-height: 1.35;
            }

            .answer-content ul,
            .answer-content ol {
                padding-left: 1.4em;
            }

            .answer-content pre {
                padding: 12px;
                overflow-x: auto;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: var(--page);
                font-size: 13px;
                line-height: 1.55;
            }

            .answer-content code {
                font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
                font-size: 0.92em;
            }

            .answer-content :not(pre) > code {
                padding: 0.12em 0.35em;
                border-radius: 5px;
                background: var(--page);
            }

            .answer-content table {
                display: block;
                max-width: 100%;
                overflow-x: auto;
                border-collapse: collapse;
            }

            .answer-content th,
            .answer-content td {
                padding: 7px 9px;
                border: 1px solid var(--border);
            }

            .answer-content blockquote {
                margin: 0.8em 0;
                padding-left: 12px;
                border-left: 3px solid var(--accent);
                color: var(--muted);
            }

            @media (min-width: 600px) {
                .page {
                    padding-right: 24px;
                    padding-left: 24px;
                }

                .answer {
                    padding: 22px 24px 24px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    scroll-behavior: auto !important;
                    transition-duration: 0.01ms !important;
                }
            }
        </style>
    </head>
    <body>
        <main class="page">
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换到深色模式" aria-pressed="false">
                <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3.7"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
                </svg>
                <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.6 8.6 0 1 0 20.2 15.2Z"></path>
                </svg>
            </button>
            <section class="answers" id="answers" aria-live="polite"></section>
        </main>

        <script>
            const root = document.documentElement;
            const themeToggle = document.getElementById('themeToggle');

            try {
                const savedTheme = localStorage.getItem('phone-companion-theme');
                if (savedTheme === 'dark' || savedTheme === 'light') root.dataset.theme = savedTheme;
            } catch (_) {
                // Theme still works for the current page when browser storage is unavailable.
            }

            function syncThemeButton() {
                const isDark = root.dataset.theme === 'dark';
                themeToggle.setAttribute('aria-pressed', String(isDark));
                themeToggle.setAttribute('aria-label', isDark ? '切换到白天模式' : '切换到夜间模式');
                document.querySelector('meta[name="theme-color"]').content = isDark ? '#111418' : '#f7f8fa';
            }

            themeToggle.addEventListener('click', () => {
                root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
                try {
                    localStorage.setItem('phone-companion-theme', root.dataset.theme);
                } catch (_) {
                    // Theme still changes for the current page.
                }
                syncThemeButton();
            });

            syncThemeButton();

            if (location.protocol === 'http:') startLiveMirror();

            async function loadScript(source) {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = source;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('页面组件加载失败'));
                    document.head.appendChild(script);
                });
            }

            async function startLiveMirror() {
                const answers = document.getElementById('answers');
                const state = { active: false, sessionId: null, responses: [], currentResponseIndex: -1, pageStart: 0, pageSize: 3, revision: 0 };
                let scrollFrame = null;
                let pendingScrollTop = null;
                let responseRenderTimer = null;

                try {
                    await Promise.all([loadScript('/assets/marked.js'), loadScript('/assets/purify.js')]);
                } catch (_) {
                    return;
                }

                function scheduleLocalScroll(top) {
                    pendingScrollTop = top;
                    if (scrollFrame !== null) return;
                    scrollFrame = requestAnimationFrame(() => {
                        scrollFrame = null;
                        const scrollable = document.scrollingElement;
                        if (!scrollable) return;
                        const maxScroll = Math.max(0, scrollable.scrollHeight - window.innerHeight);
                        scrollable.scrollTop = Math.max(0, Math.min(maxScroll, pendingScrollTop ?? scrollable.scrollTop));
                        pendingScrollTop = null;
                    });
                }

                function render(resetScroll = false) {
                    const scrollable = document.scrollingElement;
                    const previousScrollTop = pendingScrollTop ?? scrollable?.scrollTop ?? 0;
                    const pageStart = state.pageStart;
                    const visible = state.responses.slice(pageStart, pageStart + state.pageSize);

                    answers.innerHTML = visible
                        .map(response => {
                            const rendered = window.DOMPurify.sanitize(window.marked.parse(response || ''), { USE_PROFILES: { html: true } });
                            return `<article class="answer"><div class="answer-content">${rendered}</div></article>`;
                        })
                        .join('');

                    scheduleLocalScroll(resetScroll ? 0 : previousScrollTop);
                }

                function scheduleResponseRender() {
                    if (responseRenderTimer !== null) return;
                    responseRenderTimer = setTimeout(() => {
                        responseRenderTimer = null;
                        render();
                    }, 80);
                }

                function acceptUpdate(update) {
                    if (
                        !state.active ||
                        update.sessionId !== state.sessionId ||
                        !Number.isInteger(update.revision) ||
                        update.revision <= state.revision
                    ) {
                        return false;
                    }
                    state.revision = update.revision;
                    return true;
                }

                function applySnapshot(snapshot) {
                    const oldSessionId = state.sessionId;
                    const oldPageStart = state.pageStart;
                    state.active = Boolean(snapshot.active);
                    state.sessionId = typeof snapshot.sessionId === 'string' ? snapshot.sessionId : null;
                    state.responses = state.active && Array.isArray(snapshot.responses) ? snapshot.responses : [];
                    state.currentResponseIndex = state.active && Number.isInteger(snapshot.currentResponseIndex) ? snapshot.currentResponseIndex : -1;
                    state.pageStart = state.active && Number.isInteger(snapshot.pageStart) ? snapshot.pageStart : 0;
                    state.pageSize = Number.isInteger(snapshot.pageSize) && snapshot.pageSize > 0 ? snapshot.pageSize : 3;
                    state.revision = Number.isInteger(snapshot.revision) ? snapshot.revision : 0;
                    render(oldSessionId !== state.sessionId || oldPageStart !== state.pageStart);
                }

                const events = new EventSource('/events');
                events.addEventListener('snapshot', event => {
                    applySnapshot(JSON.parse(event.data));
                });
                events.addEventListener('response.new', event => {
                    const update = JSON.parse(event.data);
                    if (!acceptUpdate(update)) return;
                    const previousPageStart = state.pageStart;
                    state.responses.push(update.response || '');
                    state.currentResponseIndex = Number.isInteger(update.currentResponseIndex) ? update.currentResponseIndex : state.responses.length - 1;
                    state.pageStart = Number.isInteger(update.pageStart) ? update.pageStart : Math.floor(state.currentResponseIndex / state.pageSize) * state.pageSize;
                    if (previousPageStart !== state.pageStart) render(true);
                    else if (update.responseCount <= state.pageStart + state.pageSize) scheduleResponseRender();
                });
                events.addEventListener('response.update', event => {
                    const update = JSON.parse(event.data);
                    if (!acceptUpdate(update) || !Number.isInteger(update.index) || update.index < 0 || update.index >= state.responses.length) return;
                    state.responses[update.index] = update.response || '';
                    if (update.index >= state.pageStart && update.index < state.pageStart + state.pageSize) scheduleResponseRender();
                });
                events.addEventListener('response.append', event => {
                    const update = JSON.parse(event.data);
                    if (!acceptUpdate(update) || !Number.isInteger(update.index) || update.index < 0 || update.index >= state.responses.length || typeof update.text !== 'string') return;
                    state.responses[update.index] += update.text;
                    if (update.index >= state.pageStart && update.index < state.pageStart + state.pageSize) scheduleResponseRender();
                });
                events.addEventListener('response.discard', event => {
                    const update = JSON.parse(event.data);
                    if (!acceptUpdate(update)) return;
                    const previousPageStart = state.pageStart;
                    state.responses.length = Math.max(0, Number(update.responseCount) || 0);
                    state.currentResponseIndex = Number.isInteger(update.currentResponseIndex) ? update.currentResponseIndex : -1;
                    state.pageStart = Number.isInteger(update.pageStart) ? update.pageStart : 0;
                    render(previousPageStart !== state.pageStart);
                });
                events.addEventListener('view.state', event => {
                    const update = JSON.parse(event.data);
                    if (!acceptUpdate(update)) return;
                    const previousPageStart = state.pageStart;
                    if (Number.isInteger(update.currentResponseIndex)) state.currentResponseIndex = update.currentResponseIndex;
                    if (Number.isInteger(update.pageStart)) state.pageStart = update.pageStart;
                    if (previousPageStart !== state.pageStart) render(true);
                });
                events.addEventListener('phone.scroll', event => {
                    const update = JSON.parse(event.data);
                    if (!acceptUpdate(update) || (update.direction !== 'up' && update.direction !== 'down')) return;
                    const currentTop = pendingScrollTop ?? document.scrollingElement?.scrollTop ?? 0;
                    const distance = Math.max(96, Math.round(window.innerHeight * 0.3));
                    scheduleLocalScroll(currentTop + (update.direction === 'down' ? distance : -distance));
                });
                window.addEventListener(
                    'pagehide',
                    () => {
                        events.close();
                        if (responseRenderTimer !== null) clearTimeout(responseRenderTimer);
                        if (scrollFrame !== null) cancelAnimationFrame(scrollFrame);
                    },
                    { once: true }
                );
            }
        </script>
    </body>
</html>
