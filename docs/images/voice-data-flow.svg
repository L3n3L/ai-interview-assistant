<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 680" role="img" aria-labelledby="title desc">
  <title id="title">AI 面试助手三条语音链路数据流</title>
  <desc id="desc">千问 Omni、千问 Audio 和本地 Whisper 加 DeepSeek 三种语音链路，最终都显示在桌面回答窗口，并可只读同步到手机。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8796a8"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#163d48"/>
      <stop offset="1" stop-color="#263455"/>
    </linearGradient>
    <style>
      .title { font: 700 27px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #122235; }
      .sub { font: 15px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #637286; }
      .label { font: 600 16px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17283b; }
      .detail { font: 13px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #64748b; }
      .white { fill: #f5fafb; }
      .small { font: 12px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
    </style>
  </defs>
  <rect width="1320" height="680" rx="24" fill="#f5f7fa"/>
  <rect x="0" y="0" width="1320" height="104" rx="24" fill="url(#header)"/>
  <path d="M0 80v24h1320V80" fill="url(#header)"/>
  <text x="44" y="48" class="white" font-size="24" font-weight="700" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">三条语音链路，共用一个回答窗口</text>
  <text x="44" y="77" fill="#b8c9d5" font-size="14" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">每种模式的数据处理不同；屏幕分析单独触发，不插入实时音频流</text>

  <g>
    <rect x="34" y="130" width="1252" height="112" rx="18" fill="#ffffff" stroke="#dce4eb"/>
    <rect x="49" y="150" width="6" height="72" rx="3" fill="#4d83e6"/>
    <rect x="68" y="153" width="166" height="66" rx="13" fill="#eef3fb"/>
    <text x="151" y="180" text-anchor="middle" class="label">麦克风 / 系统音频</text>
    <text x="151" y="202" text-anchor="middle" class="detail">实时音频</text>
    <path d="M239 186h35" fill="none" stroke="#8796a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="286" y="153" width="212" height="66" rx="13" fill="#e9f5f2" stroke="#cbe6df"/>
    <text x="392" y="180" text-anchor="middle" class="label">Qwen Omni 实时</text>
    <text x="392" y="202" text-anchor="middle" class="detail">音频发送至百炼</text>
    <path d="M503 186h35" fill="none" stroke="#8796a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="550" y="153" width="212" height="66" rx="13" fill="#f0f5f7"/>
    <text x="656" y="180" text-anchor="middle" class="label">实时语音理解</text>
    <text x="656" y="202" text-anchor="middle" class="detail">模型生成文字</text>
    <path d="M767 186h35" fill="none" stroke="#8796a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="814" y="153" width="184" height="66" rx="13" fill="#f3f0fb" stroke="#e3ddf2"/>
    <text x="906" y="180" text-anchor="middle" class="label">文字回答</text>
    <text x="906" y="202" text-anchor="middle" class="detail">实时返回</text>
    <path d="M1003 186h35" fill="none" stroke="#8796a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1050" y="153" width="211" height="66" rx="13" fill="#17283b"/>
    <text x="1155" y="180" text-anchor="middle" class="white" font-size="16" font-weight="600" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">桌面回答窗口</text>
    <text x="1155" y="202" text-anchor="middle" fill="#c0cedb" class="small">同一回答列表</text>
  </g>

  <g>
    <rect x="34" y="258" width="1252" height="112" rx="18" fill="#ffffff" stroke="#dce4eb"/>
    <rect x="49" y="278" width="6" height="72" rx="3" fill="#8b6de0"/>
    <rect x="68" y="281" width="166" height="66" rx="13" fill="#eef3fb"/>
    <text x="151" y="308" text-anchor="middle" class="label">麦克风 / 系统音频</text>
    <text x="151" y="330" text-anchor="middle" class="detail">实时音频</text>
    <path d="M239 314h35" fill="none" stroke="#8796a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="286" y="281" width="212" height="66" rx="13" fill="#f1effa" stroke="#dfdaf3"/>
    <text x="392" y="308" text-anchor="middle" class="label">Qwen Audio 实时</text>
    <text x="392" y="330" text-anchor="middle" class="detail">音频发送至百炼</text>
    <path d="M503 314h35" fill="none" stroke="#8796a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="550" y="281" width="212" height="66" rx="13" fill="#f0f5f7"/>
    <text x="656" y="308" text-anchor="middle" class="label">实时语音理解</text>
    <text x="656" y="330" text-anchor="middle" class="detail">模型生成文字</text>
    <path d="M767 314h35" fill="none" stroke="#8796a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="814" y="281" width="184" height="66" rx="13" fill="#f3f0fb" stroke="#e3ddf2"/>
    <text x="906" y="308" text-anchor="middle" class="label">文字回答</text>
    <text x="906" y="330" text-anchor="middle" class="detail">实时返回</text>
    <path d="M1003 314h35" fill="none" stroke="#8796a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1050" y="281" width="211" height="66" rx="13" fill="#17283b"/>
    <text x="1155" y="308" text-anchor="middle" class="white" font-size="16" font-weight="600" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">桌面回答窗口</text>
    <text x="1155" y="330" text-anchor="middle" fill="#c0cedb" class="small">同一回答列表</text>
  </g>

  <g>
    <rect x="34" y="386" width="1252" height="112" rx="18" fill="#ffffff" stroke="#dce4eb"/>
    <rect x="49" y="406" width="6" height="72" rx="3" fill="#1b9a76"/>
    <rect x="68" y="409" width="166" height="66" rx="13" fill="#eef3fb"/>
    <text x="151" y="436" text-anchor="middle" class="label">麦克风 / 系统音频</text>
    <text x="151" y="458" text-anchor="middle" class="detail">本地音频</text>
    <path d="M239 442h35" fill="none" stroke="#8796a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="286" y="409" width="212" height="66" rx="13" fill="#e9f5ef" stroke="#cce8d9"/>
    <text x="392" y="436" text-anchor="middle" class="label">Whisper Tiny</text>
    <text x="392" y="458" text-anchor="middle" class="detail">本机转写</text>
    <path d="M503 442h35" fill="none" stroke="#8796a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="550" y="409" width="212" height="66" rx="13" fill="#f0f5f7"/>
    <text x="656" y="436" text-anchor="middle" class="label">中文转写文本</text>
    <text x="656" y="458" text-anchor="middle" class="detail">发送至 DeepSeek</text>
    <path d="M767 442h35" fill="none" stroke="#8796a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="814" y="409" width="184" height="66" rx="13" fill="#fff3e9" stroke="#f2dfcb"/>
    <text x="906" y="436" text-anchor="middle" class="label">DeepSeek Flash</text>
    <text x="906" y="458" text-anchor="middle" class="detail">生成文字回答</text>
    <path d="M1003 442h35" fill="none" stroke="#8796a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1050" y="409" width="211" height="66" rx="13" fill="#17283b"/>
    <text x="1155" y="436" text-anchor="middle" class="white" font-size="16" font-weight="600" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">桌面回答窗口</text>
    <text x="1155" y="458" text-anchor="middle" fill="#c0cedb" class="small">同一回答列表</text>
  </g>

  <rect x="34" y="527" width="800" height="109" rx="18" fill="#ffffff" stroke="#dce4eb"/>
  <circle cx="72" cy="566" r="16" fill="#e4f3f1"/>
  <path d="M65 566h14m-7-7v14" fill="none" stroke="#188b7d" stroke-width="2" stroke-linecap="round"/>
  <text x="101" y="562" class="label">手动屏幕分析</text>
  <text x="101" y="588" class="detail">用户点击分析 → 采集截图 → 独立视觉模型请求 → 加入回答列表</text>
  <text x="101" y="612" fill="#8794a3" class="small">与三条实时语音链路分开处理</text>

  <path d="M1155 499v33" fill="none" stroke="#8796a8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="870" y="545" width="416" height="91" rx="18" fill="#e9f1f5" stroke="#cbd9e2"/>
  <rect x="890" y="563" width="39" height="55" rx="8" fill="#ffffff" stroke="#9cabb9" stroke-width="2"/>
  <rect x="899" y="571" width="21" height="32" rx="3" fill="#dcebe8"/>
  <circle cx="909.5" cy="611" r="2" fill="#8191a1"/>
  <text x="948" y="578" class="label">手机只读网页</text>
  <text x="948" y="603" class="detail">同一局域网 · 回答文字与分页状态</text>
  <text x="948" y="623" fill="#8794a3" class="small">不接收音频、截图或 API Key</text>
</svg>
